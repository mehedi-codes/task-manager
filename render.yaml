services:
  - type: web
    name: task-manager
    runtime: node
    plan: free
    buildCommand: bun install && bun run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://task-manager-z8qv.onrender.com
      - key: BETTER_AUTH_TRUSTED_ORIGINS
        value: https://task-manager-z8qv.onrender.com
      - key: LOG_LEVEL
        value: info
